name: PICO2W_W5500_Vegleges
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Rendszer letöltése (minden kiegészítővel)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Szükséges Linux csomagok telepítése
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi build-essential cmake python3-pyelftools

      - name: Alaprendszer (mpy-cross) fordítása
        run: make -C mpy-cross

      - name: A Pico 2 W firmware lefordítása
        run: |
          cd ports/rp2
          make BOARD=RPI_PICO2_W submodules
          make BOARD=RPI_PICO2_W

      - name: Fájl kimentése letöltésre
        uses: actions/upload-artifact@v4
        with:
          name: pico2w-w5500-firmware
          path: ports/rp2/build-RPI_PICO2_W/*.uf2
